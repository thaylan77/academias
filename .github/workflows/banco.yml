name: Banco

on: [pull_request, push]

# Imagem e actions em versão exata: a troca não cai sozinha no meio de um PR.
# As actions vão pelo sha do commit da tag (a tag pode ser movida; o sha, não).

jobs:
  testes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Versão fixa: a saída de `gen types` muda entre versões da CLI.
      # Os agentes usam a mesma (`npx supabase@2.119.0`, ver AGENTS.md).
      - uses: supabase/setup-cli@afb1b15109756ea5cf9d8985a359d9095235ca2b # v2.1.2
        with:
          version: 2.119.0

      - run: supabase db start

      - name: Gera os tipos a partir do banco local
        run: supabase gen types typescript --local > "$RUNNER_TEMP/database.ts"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: database-types
          path: ${{ runner.temp }}/database.ts

      - run: supabase test db

      - name: Confere se src/types/database.ts está atualizado
        if: ${{ !cancelled() }}
        run: |
          if ! diff -u src/types/database.ts "$RUNNER_TEMP/database.ts"; then
            echo "::error file=src/types/database.ts::Tipos desatualizados. Baixe o artifact database-types desta execução e commite como src/types/database.ts."
            exit 1
          fi

  # Edge Functions: formatação, lint, tipos e testes com o Auth simulado.
  # Deno em versão fixa, a mesma dos agentes (ver AGENTS.md).
  funcoes:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: 2.5.6

      - run: deno fmt --check
      - run: deno lint
      - run: deno check --frozen .
      # Todos os *_test.ts de tests/ (a integração fica em tests/integracao/).
      - run: deno test --frozen --no-prompt tests/*_test.ts

  # Integração das Edge Functions com o Auth real: banco, Auth, API, Mailpit
  # e o runtime das funções locais (supabase start sem os serviços que não
  # entram no teste). As funções sobem pelo gateway, com o verify_jwt e o
  # import map de verdade.
  integracao:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: supabase/setup-cli@afb1b15109756ea5cf9d8985a359d9095235ca2b # v2.1.2
        with:
          version: 2.119.0

      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: 2.5.6

      - run: supabase start -x realtime,storage-api,imgproxy,postgres-meta,studio,logflare,vector,supavisor

      - name: Testes de integração com o Auth local
        working-directory: supabase/functions
        run: |
          eval "$(supabase status -o env)"
          SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          MAILPIT_URL="${MAILPIT_URL:-$INBUCKET_URL}" INTEGRACAO=1 \
            deno test --frozen --no-prompt \
              --allow-env=SUPABASE_URL,SUPABASE_ANON_KEY,SUPABASE_SERVICE_ROLE_KEY,MAILPIT_URL,INTEGRACAO \
              --allow-net=127.0.0.1:54321,127.0.0.1:54324 tests/integracao/

  # Front: mesma sequência do checklist do AGENTS.md. Node em versão fixa,
  # a mesma dos agentes, lida do .nvmrc (o "engines" do package.json repete
  # o número); as dependências vêm do package-lock.json (npm ci).
  front:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - run: npm run build
